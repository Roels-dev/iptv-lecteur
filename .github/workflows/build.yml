name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "playlists/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Check licence server (faux code, n'utilise aucun vrai code)
        run: |
          URL=$(grep '^iptv.supabaseUrl=' gradle.properties | cut -d= -f2-)
          KEY=$(grep '^iptv.supabaseKey=' gradle.properties | cut -d= -f2-)
          RES=$(curl -sS -X POST "$URL/rest/v1/rpc/iptv_activate_licence" \
            -H "apikey: $KEY" -H "Content-Type: application/json" \
            -d '{"p_code":"ZZZZ-ZZZZ-ZZZZ","p_device":"ci-check","p_device_name":"GitHub Actions"}')
          echo "Réponse : $RES"
          echo "$RES" | grep -q '"reason" *: *"invalid"'

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 manquant (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/iptv-lecteur.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/iptv-lecteur.jks" >> "$GITHUB_ENV"

      - name: Build debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleDebug --no-daemon

      - name: Check signature
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $APKSIGNER verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -i "certificate DN"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk IPTV-Lecteur.apk

      - uses: actions/upload-artifact@v4
        with:
          name: IPTV-Lecteur
          path: IPTV-Lecteur.apk

      - name: Publish release (download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: IPTV Lecteur – build ${{ github.run_number }}
          make_latest: true
          files: IPTV-Lecteur.apk
